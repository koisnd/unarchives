unarchive:
  - path: /path/to/rar_or_zip/
    rar:
      expression: '.rar$'
      ignore_case: true
      delete_on_success: true
      rename_on_error: true
      error_stop: true
    zip:
      expression: '.zip$'
      ignore_case: true
      delete_on_success: true
      rename_on_error: true
      error_stop: true
    7z:
      expression: '.7z$'
      ignore_case: true
      delete_on_success: true
      rename_on_error: true
      error_stop: true
    gz: false

includes:
  - /etc/unarchives.yaml
  - ~/.unarchives.yaml

default_behavior:
  rar:
    expression: '.rar$'
    ignore_case: true
    delete_on_success: true
    rename_on_error: true
    error_stop: true
  zip:
    expression: '.zip$'
    ignore_case: true
    delete_on_success: true
    rename_on_error: true
    error_stop: true
  7z:
    expression: '.7z$'
    ignore_case: true
    delete_on_success: true
    rename_on_error: true
    error_stop: true
  gz: false

replace:
  chars:
    - ['"', '']
    - ['／', '']
    - ['＜', '']
    - ['＞', '']
    - ['～', '-']
    - ['：', '-']
    - ['…', '']
    - ['？', '']
    - [':', '']
    - ['\?', '']
    - ['\*', '']
    - ["\\", '']
